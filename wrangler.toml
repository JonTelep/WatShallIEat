name = "watshallieat"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "watshallieat.com"
custom_domain = true

[[routes]]
pattern = "www.watshallieat.com"
custom_domain = true
